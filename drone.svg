<svg width="100%" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="220" fill="#0d1117"/>

  <!-- Whole drone group (tilted + floating) -->
  <g transform="translate(400,110) rotate(-15)">

    <!-- Arms -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#00d4ff" stroke-width="4"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#00d4ff" stroke-width="4"/>

    <!-- Center body -->
    <circle cx="0" cy="0" r="12" fill="#00d4ff"/>
    <circle cx="0" cy="0" r="20" stroke="#00d4ff" opacity="0.3" fill="none"/>

    <!-- Rotors -->
    <g>
      <!-- Rotor template -->
      <g id="rotor">
        <circle r="14" stroke="#00d4ff" fill="none"/>
        <circle r="18" stroke="#00d4ff" opacity="0.2" fill="none"/>
        
        <!-- spinning blade -->
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#00d4ff" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="360 0 0" dur="0.8s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Rotor positions -->
      <g transform="translate(-70,0)"><use href="#rotor"/></g>
      <g transform="translate(70,0)"><use href="#rotor"/></g>
      <g transform="translate(0,-70)"><use href="#rotor"/></g>
      <g transform="translate(0,70)"><use href="#rotor"/></g>
    </g>

    <!-- Signal pulse -->
    <circle cx="0" cy="0" r="25" stroke="#00d4ff" fill="none" opacity="0.4">
      <animate attributeName="r" values="25;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Floating animation -->
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 0,-8; 0,0"
    dur="3s" repeatCount="indefinite"/>

</svg>
